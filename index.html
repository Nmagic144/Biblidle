<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biblidle</title>
  <meta name="description" content="A daily Bible verse guessing game. Guess the book, chapter and verse (KJV).">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Biblidle</h1>
      <div class="stats" id="stats" aria-live="polite"></div>
    </header>

    <blockquote id="quote" class="quote"></blockquote>
    <p class="legend">
      <span class="chip g"></span> exact
      <span class="chip y"></span> same section / digit elsewhere
      <span class="chip o"></span> same testament
      <span class="chip x"></span> no
      <br>answer is &uarr; earlier in the Bible &middot; &darr; lateruarr; earlier in the Bible or &uarr; earlier in the Bible &middot; &darr; laterdarr; later
    </p>

    <section id="board" class="board" aria-label="Guesses"></section>

    <section id="input" class="input">
      <div class="combo" id="combo">
        <input id="book" type="text" placeholder="Book of the Bible" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="booklist">
        <button type="button" id="bookToggle" class="toggle" aria-label="Show all books">&#9662;</button>
        <ul id="booklist" class="booklist" role="listbox" hidden></ul>
      </div>

      <div class="numbers">
        <button type="button" id="chBox" class="numbox active" aria-label="Chapter"><small>chapter</small><span></span></button>
        <span class="colon">:</span>
        <button type="button" id="vBox" class="numbox" aria-label="Verse"><small>verse</small><span></span></button>
      </div>

      <div class="keypad" id="keypad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="back" aria-label="Backspace">&#9003;</button><button type="button" data-k="0">0</button><button type="button" data-k="enter" aria-label="Next">&#8629;</button>
      </div>

      <button type="button" id="guess" class="guess">Guess</button>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <section id="result" class="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultRef" class="ref"></p>
      <p id="resultText" class="text"></p>
      <button type="button" id="share" class="guess">Copy to share</button>
      <p class="next">Next verse in <span id="countdown"></span></p>
    </section>

    <footer>King James Version &middot; a new verse every day</footer>
  </main>

  <script src="verses.js"></script>
  <script src="app.js"></script>
</body>
</html>
